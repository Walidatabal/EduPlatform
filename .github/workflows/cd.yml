name: CD — Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eduplatform-api:latest
            ghcr.io/${{ github.repository_owner }}/eduplatform-api:${{ github.sha }}

      # Add your deployment step here (SSH, Azure, etc.)
      # - name: Deploy to server
      #   run: ssh user@server 'cd /app && docker compose pull && docker compose up -d'
